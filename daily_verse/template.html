<!doctype html>
<html lang="$lang"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;1,400&family=Noto+Serif+Tamil:wght@400;500&family=Noto+Sans+Tamil:wght@400;500&family=Roboto:wght@400;500&display=block" rel="stylesheet">
<style>
  :root { --green:#205b4f; --deep:#173f37; --teal:#53a292; --sand:#cba590; --mist:#d9e8e5; }
  * { box-sizing:border-box; margin:0; }
  html, body { width:1080px; height:1350px; overflow:hidden; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #2a6f60 0%, var(--green) 45%, var(--deep) 100%);
    color:#fff; font-family:$sans;
    display:flex; flex-direction:column; align-items:center; padding:84px 96px 64px;
    position:relative;
  }
  .frame { position:absolute; inset:36px; border:2px solid rgba(203,165,144,.45); border-radius:28px; pointer-events:none; }
  .mountains { position:absolute; left:0; right:0; bottom:0; width:100%; height:300px; opacity:.08; }
  .logo { width:170px; height:170px; }
  .label { margin-top:30px; color:var(--sand); font-size:30px; font-weight:500; letter-spacing:$label_spacing; text-transform:uppercase; }
  .date { margin-top:10px; color:var(--mist); font-size:26px; opacity:.85; }
  .rule { width:120px; height:2px; background:var(--sand); opacity:.7; margin:40px 0 0; }
  .verse { flex:1; width:100%; display:flex; flex-direction:column; justify-content:center; text-align:center; overflow:hidden; padding:24px 0; }
  .text { font-family:$serif; font-size:${size}px; line-height:$line_height; font-weight:400; }
  .q { color:var(--teal); }
  .ref { margin-top:36px; color:var(--sand); font-size:36px; font-weight:500; letter-spacing:.04em; }
  .credit { color:var(--mist); opacity:.7; font-size:19px; text-align:center; max-width:820px; line-height:1.4; }
  .church { margin-top:14px; color:#fff; font-family:'Roboto', sans-serif; font-size:24px; letter-spacing:.06em; opacity:.95; }
  .church span { color:var(--sand); }
</style></head>
<body>
  <div class="frame"></div>
  <svg class="mountains" viewBox="0 0 1080 300" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#fff" d="M0 300 L0 210 L140 130 L230 190 L360 70 L470 170 L560 110 L650 180 L780 40 L900 160 L980 120 L1080 190 L1080 300 Z"/>
  </svg>
  <img class="logo" src="$logo" alt="">
  <div class="label">$label</div>
  <div class="date">$date</div>
  <div class="rule"></div>
  <div class="verse" id="box"><div class="text" id="text"><span class="q">$q_open</span>$text<span class="q">$q_close</span></div><div class="ref">$reference</div></div>
  <div class="credit">$credit</div>
  <div class="church">Christ the Living Petra Church <span>·</span> christ-livingpetra.de</div>
<script>
  // Shrink the verse until it fits its box, so long verses never overflow.
  document.fonts.ready.then(() => {
    const box = document.getElementById('box'), text = document.getElementById('text');
    let size = $size;
    // Long Tamil words cannot wrap, so check width as well as height.
    const overflowing = () => box.scrollHeight > box.clientHeight || text.scrollWidth > text.clientWidth;
    while (overflowing() && size > 28) { size -= 2; text.style.fontSize = size + 'px'; }
  });
</script>
</body></html>
