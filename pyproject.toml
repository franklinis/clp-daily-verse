[project]
name = "clp-daily-verse"
version = "0.1.0"
description = "Daily verse carousel (Tamil, English, German) for Christ the Living Petra Church"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 125

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
