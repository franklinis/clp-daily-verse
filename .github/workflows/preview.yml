name: Preview narration

# Builds read-aloud videos for listening, as a private download on the run page.
# Nothing is published and Buffer is not touched.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date (YYYY-MM-DD). Empty = tomorrow."
        required: false
      days:
        description: "How many days"
        required: false
        default: "1"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      MEDIA_DIR: ${{ github.workspace }}/media
      START: ${{ inputs.start }}
      DAYS: ${{ inputs.days || '1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ffmpeg
        run: pip install -r requirements.txt

      - name: Read verses already fetched
        run: git fetch origin media && git worktree add media FETCH_HEAD || mkdir -p media

      - name: Render narrated videos
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
        run: python -m daily_verse preview ${START:+--start "$START"} --days "$DAYS" --out preview

      - uses: actions/upload-artifact@v4
        with:
          name: narration-preview
          path: preview/*.mp4
          retention-days: 7
