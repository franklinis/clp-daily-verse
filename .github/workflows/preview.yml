name: Preview narration

# Builds read-aloud videos or verse-matched backgrounds for review, as a private download on the run page.
# Nothing is published and Buffer is not touched.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First date (YYYY-MM-DD). Empty = tomorrow."
        required: false
      days:
        description: "How many days"
        required: false
        default: "1"
      kind:
        description: "What to preview"
        type: choice
        options: [narration, backgrounds]
        default: narration

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      MEDIA_DIR: ${{ github.workspace }}/media
      START: ${{ inputs.start }}
      DAYS: ${{ inputs.days || '1' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install ffmpeg
        run: pip install -r requirements.txt

      - name: Read verses already fetched
        run: git fetch origin media && git worktree add media FETCH_HEAD || mkdir -p media

      - name: Render preview
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_IMAGE_DEPLOYMENT: ${{ vars.AZURE_IMAGE_DEPLOYMENT }}
          KIND: ${{ inputs.kind || 'narration' }}
        run: python -m daily_verse preview ${START:+--start "$START"} --days "$DAYS" --out preview --kind "$KIND"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.kind || 'narration' }}-preview
          path: |
            preview/*.mp4
            preview/*.jpg
            preview/*.png
          retention-days: 7
